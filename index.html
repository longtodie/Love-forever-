<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>forever Ð - Anime Tuxedo Cats</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffe6e8 0%, #ffd3d8 100%);
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* حاوية قطط الأنمي في الخلفية */
        .cats-group {
            position: absolute;
            bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 15px;
            z-index: 1;
            width: 100%;
        }

        .anime-cat {
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.15));
        }

        /* القطة المركزية أكبر قليلاً */
        .cat-main {
            transform: scale(1.15);
            z-index: 2;
        }

        /* حاوية القلب والنص */
        .heart-container {
            position: relative;
            z-index: 3;
            text-align: center;
            margin-bottom: 80px;
        }

        .heart-svg {
            width: 330px;
            height: 330px;
        }

        .heart-path {
            stroke: #ff2a6d;
            stroke-width: 6;
            fill: rgba(255, 255, 255, 0.45);
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawHeart 4s ease-out forwards;
            stroke-linecap: round;
        }

        @keyframes drawHeart {
            to {
                stroke-dashoffset: 0;
            }
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 900;
            color: #880e4f;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            opacity: 0;
            animation: fadeInText 1.2s ease-in 3.5s forwards;
            letter-spacing: 1px;
        }

        @keyframes fadeInText {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <!-- مجموعة قطط التوكسيدو بستايل الأنمي الياباني -->
    <div class="cats-group">
        
        <!-- قط أنمي 1 (اليسار) -->
        <svg class="anime-cat" width="130" height="150" viewBox="0 0 150 170">
            <!-- التاج -->
            <path d="M55,35 L65,15 L75,28 L85,15 L95,35 Z" fill="#ffd700" stroke="#ffaa00" stroke-width="2"/>
            <circle cx="75" cy="28" r="3" fill="#ff0055"/>
            <!-- الأذنان -->
            <path d="M30,65 Q20,20 60,45 Z" fill="#222"/>
            <path d="M35,60 Q28,30 55,48 Z" fill="#ffb7c5"/>
            <path d="M120,65 Q130,20 90,45 Z" fill="#222"/>
            <path d="M115,60 Q122,30 95,48 Z" fill="#ffb7c5"/>
            <!-- الرأس والخدود -->
            <ellipse cx="75" cy="80" rx="48" ry="40" fill="#222"/>
            <ellipse cx="75" cy="88" rx="32" ry="25" fill="#fff"/>
            <circle cx="48" cy="88" r="8" fill="#ffa4b6" opacity="0.6"/>
            <circle cx="102" cy="88" r="8" fill="#ffa4b6" opacity="0.6"/>
            <!-- عيون أنمي خضراء كبيرة -->
            <ellipse cx="58" cy="78" rx="10" ry="14" fill="#00e676"/>
            <ellipse cx="92" cy="78" rx="10" ry="14" fill="#00e676"/>
            <ellipse cx="58" cy="78" rx="4" ry="10" fill="#05441a"/>
            <ellipse cx="92" cy="78" rx="4" ry="10" fill="#05441a"/>
            <circle cx="55" cy="72" r="4" fill="#fff"/>
            <circle cx="89" cy="72" r="4" fill="#fff"/>
            <!-- الأنف واللقمة -->
            <polygon points="73,88 77,88 75,91" fill="#ff80ab"/>
            <path d="M70,93 Q75,97 75,93 Q75,97 80,93" stroke="#333" stroke-width="2" fill="none"/>
            <!-- الجسم (توكسيدو) -->
            <path d="M45,115 Q75,105 105,115 L115,160 L35,160 Z" fill="#222"/>
            <polygon points="75,110 58,160 92,160" fill="#fff"/>
            <circle cx="75" cy="125" r="3" fill="#e91e63"/>
        </svg>

        <!-- قط أنمي 2 (الوسط - الرئيسي) -->
        <svg class="anime-cat cat-main" width="150" height="170" viewBox="0 0 150 170">
            <!-- التاج الملكي -->
            <path d="M50,30 L65,10 L75,25 L85,10 L100,30 Z" fill="#ffd700" stroke="#e6b800" stroke-width="2"/>
            <circle cx="65" cy="10" r="3" fill="#00e676"/>
            <circle cx="75" cy="25" r="3.5" fill="#ff0055"/>
            <circle cx="85" cy="10" r="3" fill="#00e676"/>
            <!-- الأذنان -->
            <path d="M25,60 Q15,15 58,40 Z" fill="#1a1a1a"/>
            <path d="M30,55 Q22,25 52,43 Z" fill="#ffb7c5"/>
            <path d="M125,60 Q135,15 92,40 Z" fill="#1a1a1a"/>
            <path d="M120,55 Q128,25 98,43 Z" fill="#ffb7c5"/>
            <!-- الرأس والوجه -->
            <ellipse cx="75" cy="75" rx="52" ry="42" fill="#1a1a1a"/>
            <ellipse cx="75" cy="85" rx="35" ry="28" fill="#fff"/>
            <!-- خدود أنمي وشارب -->
            <circle cx="45" cy="85" r="9" fill="#ff80ab" opacity="0.6"/>
            <circle cx="105" cy="85" r="9" fill="#ff80ab" opacity="0.6"/>
            <!-- عيون أنمي زمردية لمعة قوية -->
            <ellipse cx="56" cy="72" rx="11" ry="16" fill="#00c853"/>
            <ellipse cx="94" cy="72" rx="11" ry="16" fill="#00c853"/>
            <ellipse cx="56" cy="72" rx="4" ry="11" fill="#003b0f"/>
            <ellipse cx="94" cy="72" rx="4" ry="11" fill="#003b0f"/>
            <circle cx="52" cy="65" r="5" fill="#fff"/>
            <circle cx="90" cy="65" r="5" fill="#fff"/>
            <circle cx="59" cy="78" r="2" fill="#fff"/>
            <circle cx="97" cy="78" r="2" fill="#fff"/>
            <!-- الأنف والفم -->
            <polygon points="73,84 77,84 75,87" fill="#ff4081"/>
            <path d="M68,90 Q75,95 75,90 Q75,95 82,90" stroke="#222" stroke-width="2" fill="none"/>
            <!-- بدلة التوكسيدو والفيونكة -->
            <path d="M40,110 Q75,100 110,110 L122,165 L28,165 Z" fill="#1a1a1a"/>
            <polygon points="75,105 55,165 95,165" fill="#fff"/>
            <path d="M65,112 L75,117 L65,122 Z M85,112 L75,117 L85,122 Z" fill="#ff1744"/>
            <circle cx="75" cy="117" r="2.5" fill="#d50000"/>
        </svg>

        <!-- قط أنمي 3 (اليمين) -->
        <svg class="anime-cat" width="130" height="150" viewBox="0 0 150 170">
            <!-- التاج -->
            <path d="M55,35 L65,15 L75,28 L85,15 L95,35 Z" fill="#ffd700" stroke="#ffaa00" stroke-width="2"/>
            <circle cx="75" cy="28" r="3" fill="#ff0055"/>
            <!-- الأذنان -->
            <path d="M30,65 Q20,20 60,45 Z" fill="#222"/>
            <path d="M35,60 Q28,30 55,48 Z" fill="#ffb7c5"/>
            <path d="M120,65 Q130,20 90,45 Z" fill="#222"/>
            <path d="M115,60 Q122,30 95,48 Z" fill="#ffb7c5"/>
            <!-- الرأس والخدود -->
            <ellipse cx="75" cy="80" rx="48" ry="40" fill="#222"/>
            <ellipse cx="75" cy="88" rx="32" ry="25" fill="#fff"/>
            <circle cx="48" cy="88" r="8" fill="#ffa4b6" opacity="0.6"/>
            <circle cx="102" cy="88" r="8" fill="#ffa4b6" opacity="0.6"/>
            <!-- عيون أنمي خضراء كبيرة -->
            <ellipse cx="58" cy="78" rx="10" ry="14" fill="#00e676"/>
            <ellipse cx="92" cy="78" rx="10" ry="14" fill="#00e676"/>
            <ellipse cx="58" cy="78" rx="4" ry="10" fill="#05441a"/>
            <ellipse cx="92" cy="78" rx="4" ry="10" fill="#05441a"/>
            <circle cx="55" cy="72" r="4" fill="#fff"/>
            <circle cx="89" cy="72" r="4" fill="#fff"/>
            <!-- الأنف واللقمة -->
            <polygon points="73,88 77,88 75,91" fill="#ff80ab"/>
            <path d="M70,93 Q75,97 75,93 Q75,97 80,93" stroke="#333" stroke-width="2" fill="none"/>
            <!-- الجسم (توكسيدو) -->
            <path d="M45,115 Q75,105 105,115 L115,160 L35,160 Z" fill="#222"/>
            <polygon points="75,110 58,160 92,160" fill="#fff"/>
            <circle cx="75" cy="125" r="3" fill="#e91e63"/>
        </svg>

    </div>

    <!-- رسم القلب والنص -->
    <div class="heart-container">
        <svg class="heart-svg" viewBox="0 0 500 500">
            <path class="heart-path" d="M250,100 C150,-50 0,50 0,200 C0,350 250,500 250,500 C250,500 500,350 500,200 C500,50 350,-50 250,100 Z"></path>
        </svg>
        <div class="text">forever Ð</div>
    </div>

</body>
</html>
